<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Congress Registrations | Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../styles.css" />
</head>
<body class="min-h-screen bg-[#12031f] text-slate-100">
    <main class="mx-auto max-w-7xl px-4 py-10 sm:px-6 lg:px-8">
        <header class="mb-8 flex flex-wrap items-center justify-between gap-4">
            <div>
                <p class="text-sm font-semibold uppercase tracking-widest text-amber-400">IEEE Pune Section</p>
                <h1 class="mt-2 text-3xl font-extrabold text-white">Congress registrations</h1>
            </div>
            <a href="/" class="rounded-full border border-purple-700 px-4 py-2 text-sm text-purple-100 hover:bg-purple-900/60">Public website</a>
        </header>

        <section id="login-panel" class="mx-auto max-w-md rounded-2xl border border-purple-800 bg-[#1a062b] p-6 sm:p-8">
            <h2 class="text-xl font-bold text-white">Admin sign in</h2>
            <p class="mt-2 text-sm text-purple-200">Sign in with an authorized organizer account.</p>
            <form id="login-form" class="mt-6 space-y-4">
                <div>
                    <label for="email" class="mb-1 block text-sm font-medium text-purple-100">Email</label>
                    <input id="email" type="email" autocomplete="username" required
                        class="w-full rounded-xl border border-purple-800 bg-purple-950/80 px-4 py-3 text-white focus:border-amber-400 focus:outline-none" />
                </div>
                <div>
                    <label for="password" class="mb-1 block text-sm font-medium text-purple-100">Password</label>
                    <input id="password" type="password" autocomplete="current-password" required
                        class="w-full rounded-xl border border-purple-800 bg-purple-950/80 px-4 py-3 text-white focus:border-amber-400 focus:outline-none" />
                </div>
                <p id="login-error" class="hidden text-sm text-red-300" role="alert"></p>
                <button id="login-button" type="submit"
                    class="w-full rounded-xl bg-amber-400 px-4 py-3 font-bold text-purple-950 hover:bg-amber-300 disabled:opacity-60">Sign in</button>
            </form>
        </section>

        <section id="registrations-panel" class="hidden">
            <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
                <p id="page-status" class="text-sm text-purple-200" role="status"></p>
                <div class="flex gap-2">
                    <button id="refresh-button" type="button" class="rounded-full border border-purple-700 px-4 py-2 text-sm hover:bg-purple-900/60">Refresh</button>
                    <button id="signout-button" type="button" class="rounded-full border border-purple-700 px-4 py-2 text-sm hover:bg-purple-900/60">Sign out</button>
                </div>
            </div>
            <p id="data-error" class="mb-4 hidden text-sm text-red-300" role="alert"></p>
            <div class="overflow-x-auto rounded-2xl border border-purple-800 bg-[#1a062b]">
                <table class="min-w-full text-left text-sm">
                    <thead class="bg-purple-950/80 text-xs uppercase tracking-wide text-purple-200">
                        <tr>
                            <th class="px-4 py-3">Registered</th>
                            <th class="px-4 py-3">Name</th>
                            <th class="px-4 py-3">Email</th>
                            <th class="px-4 py-3">Phone</th>
                            <th class="px-4 py-3">College</th>
                            <th class="px-4 py-3">IEEE ID</th>
                            <th class="px-4 py-3">Track</th>
                            <th class="px-4 py-3">Workshop</th>
                        </tr>
                    </thead>
                    <tbody id="registrations-body" class="divide-y divide-purple-900/70"></tbody>
                </table>
            </div>
            <nav class="mt-4 flex items-center justify-between" aria-label="Registration pages">
                <button id="previous-page" type="button" class="rounded-full border border-purple-700 px-4 py-2 text-sm disabled:opacity-40">Previous</button>
                <span id="page-number" class="text-sm text-purple-200"></span>
                <button id="next-page" type="button" class="rounded-full border border-purple-700 px-4 py-2 text-sm disabled:opacity-40">Next</button>
            </nav>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase-config.js"></script>
    <script src="admin.js"></script>
</body>
</html>
